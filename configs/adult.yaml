project_name: "tabdce-diffusion" 
run_name: "adult-TabSyn-dpp"

dataset:
  name: "adult"
  data_dir: "data/adult"  
  n_samples: 5000
  noise: 0.1
  k_neighbors: 50
  search_method: "knn"
  scaler: "standard"  #"quantile" , "standard"

classifier:
  train: true           
  relabel: true         
  hidden_layers: [64, 32] 
  lr: 0.001
  epochs: 100
  batch_size: 64

diffusion:
  T: 50
  schedule: "cosine"

vae:
  latent_dim: 64 
  hidden_dims: [256, 128]
  lr: 0.0001
  epochs: 1000
  vae_path: "checkpoints/adult_vae_trans_large.pt"       # Skąd ma próbować wczytać
  vae_save_path: "checkpoints/adult_vae_trans_large.pt"  

model:
  hidden_dim: 2512
  depth: 5
  dropout: 0.0

train:
  batch_size: 32
  lr: 0.0001
  epochs: 1000
  device: "cuda"
  output_dir: "checkpoints_const"

svdd:
  n_candidates: 50
  guidance_scale: 20.0
  dist_scale: 0.1
  cat_scale: 0.0
  temperature: 2.0

eval:
  n_test_samples: 500
  n_cf_per_sample: 10