project_name: "twomoons_diffusion"

dataset:
  name: "twomoons"
  n_samples: 1000
  noise: 0.1
  k_neighbors: 15
  search_method: "dpp"
  scaler: "standard" 

diffusion:
  T: 200              
  schedule: "cosine"

model:
  hidden_dim: 128
  depth: 3
  dropout: 0.0

train:
  batch_size: 32
  lr: 0.001
  epochs: 2000
  device: "cpu"
  output_dir: "checkpoints_const"