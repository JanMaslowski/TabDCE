project_name: "tabdce-diffusion" 
run_name: "two-moons-TabDiff-SDEdit"

dataset:
  name: "two_moons"
  data_dir: "data/two_moons"  
  n_samples: 1000
  k_neighbors: 20
  search_method: "dpp"
  scaler: "standard"  # Upewnij się, że w run_tabsyn.py przekazujesz: scaler_type=cfg['dataset'].get('scaler', 'standard')
  n_test_samples: 200
  n_cf_per_sample: 10

classifier:
  train: true           
  hidden_layers: [32, 32] 
  lr: 0.001
  epochs: 100
  batch_size: 64

diffusion:
  T: 50 

model:
  num_layers: 2      # Podbijamy do 4. Dajemy sieci czas na przemyślenie ruchu.
  d_token: 16        # [KLUCZOWE] Zwiększamy z 8 na 32. Punkty wreszcie będą miały rozdzielczość, by trafić w dystrybucję.
  n_head: 2          # 4 głowy atencji - model szybciej skojarzy współrzędne z warunkiem klasy.
  dim_t: 64       # [KLUCZOWE] Dyfuzja musi mieć szerokie gardło dla czasu t! W oryginalnych pracach to zazwyczaj 256 lub 512. My dajemy solidne 128.
  factor: 5          # Mnożnik dla warstwy FeedForward (d_token * factor)

train:
  batch_size: 32
  lr: 0.001
  epochs: 2500
  device: "cuda"
  output_dir: "checkpoints_const"