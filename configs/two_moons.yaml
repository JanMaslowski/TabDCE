project_name: "tabdce-diffusion" 
run_name: "two-moons-TabSyn-dpp"

dataset:
  name: "two_moons"
  data_dir: "data/two_moons"  
  n_samples: 1000
  noise: 0.1
  k_neighbors: 20
  search_method: "knn"
  scaler: "standard"  #"quantile" , "standard"

classifier:
  train: true           
  relabel: true         
  hidden_layers: [64, 32] 
  lr: 0.001
  epochs: 100
  batch_size: 64

diffusion:
  T: 50
  schedule: "cosine"

vae:
  latent_dim: 2
  hidden_dims: [16, 16]
  lr: 0.0001
  epochs: 250
  vae_path: "checkpoints/two_moons_2dim_2.pt"       # Skąd ma próbować wczytać
  vae_save_path: "checkpoints/two_moons_2dim_2.pt"

model:
  hidden_dim: 32
  depth: 2
  dropout: 0.0

train:
  batch_size: 16
  lr: 0.0005
  epochs: 500
  device: "cuda"
  output_dir: "checkpoints_const"

svdd:
  n_candidates: 50
  guidance_scale: 20.0
  dist_scale: 0.1
  cat_scale: 0.0
  temperature: 2.0

eval:
  n_test_samples: 200
  n_cf_per_sample: 10