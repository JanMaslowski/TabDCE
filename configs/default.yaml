project_name: "tabdce-diffusion"  
run_name: "default-TabSyn-AE"

dataset:
  name: "default"
  data_dir: "data/default"  
  n_samples: 5000
  noise: 0.1
  k_neighbors: 50
  search_method: "knn"
  scaler: "standard" 

classifier:
  train: true           
  relabel: true         
  hidden_layers: [64, 32] 
  lr: 0.001
  epochs: 100
  batch_size: 64

diffusion:
  T: 50
  schedule: "cosine"

vae:
  latent_dim: 64 
  hidden_dims: [256, 128]
  lr: 0.0001
  epochs: 400
  vae_path: "checkpoints/AE_bank.pt"       # Skąd ma próbować wczytać
  vae_save_path: "checkpoints/AE_bank.pt"  

model:
  hidden_dim: 256
  depth: 5
  dropout: 0.0

train:
  batch_size: 32
  lr: 0.0001
  epochs: 1000
  device: "cuda"
  output_dir: "checkpoints_tabsyn"

svdd:
  n_candidates: 50
  guidance_scale: 20.0
  dist_scale: 0.1
  cat_scale: 0.0
  temperature: 2.0

eval:
  n_test_samples: 1000
  n_cf_per_sample: 10