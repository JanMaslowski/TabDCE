project_name: "DICTUM"
run_name: "DICTUM_gmc"

dataset:
  name: "gmc"
  data_dir: "data/gmc"  
  n_samples: 20000
  k_neighbors: 150
  search_method: "dpp"
  scaler: "standard"
  n_test_samples: 2000
  n_cf_per_sample: 10
  dpp_m: 0.5

classifier:
  train: true           
  hidden_layers: [32, 32] 
  lr: 0.001
  epochs: 100
  batch_size: 64

diffusion:
  T: 50

model:
  num_layers: 4
  d_token: 4
  n_head: 1
  dim_t: 256
  factor: 32

train:
  batch_size: 512
  lr: 0.001
  epochs: 4000
  device: "cuda"
  output_dir: "checkpoints_gmc"