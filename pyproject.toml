[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tabdce"
version = "0.1.0"
description = "Counterfactual explainations with diffusion model"
authors = [
    {name = "-"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "seaborn>=0.13.2",
    "wandb>=0.16.0"
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.1.1",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7"
]